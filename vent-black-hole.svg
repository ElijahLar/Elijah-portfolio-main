<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="VENT black hole artwork">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="72%">
      <stop offset="0" stop-color="#0d111c"/>
      <stop offset="0.58" stop-color="#090c14"/>
      <stop offset="1" stop-color="#06080d"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0.48" stop-color="#050608" stop-opacity="0"/>
      <stop offset="0.58" stop-color="#8da9ff" stop-opacity="0.9"/>
      <stop offset="0.66" stop-color="#6d8cff" stop-opacity="0.44"/>
      <stop offset="0.78" stop-color="#3e5cc9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#263564" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="blur14" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="500" cy="490" r="330" fill="url(#aura)" filter="url(#blur40)" opacity="0.95"/>
  <circle cx="500" cy="490" r="292" fill="none" stroke="#6f8fff" stroke-width="38" opacity="0.34" filter="url(#blur14)"/>
  <circle cx="500" cy="490" r="264" fill="#000" stroke="#7798ff" stroke-width="18" opacity="0.98" filter="url(#softGlow)"/>
  <circle cx="500" cy="490" r="258" fill="#000"/>
  <circle cx="500" cy="490" r="261" fill="none" stroke="#b9caff" stroke-width="4" opacity="0.92"/>
  <ellipse cx="500" cy="490" rx="278" ry="266" fill="none" stroke="#6f8fff" stroke-width="6" opacity="0.24" transform="rotate(-7 500 490)"/>
</svg>
